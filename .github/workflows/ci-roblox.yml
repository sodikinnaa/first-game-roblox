name: CI & Build Roblox Place

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Roblox and replace the configured place
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Luau test runtime
        run: |
          mkdir -p build/tools
          curl -fLsS https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip -o build/tools/luau.zip
          unzip -q build/tools/luau.zip -d build/tools
          chmod +x build/tools/luau build/tools/luau-compile

      - name: Run Mechanics Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build-and-publish:
    name: Build Place (Publish Optional)
    needs: test

    runs-on: ubuntu-latest
    environment: roblox
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rojo Binary
        run: |
          ROJO_VERSION="7.7.1"
          curl -fLsS "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" -o rojo.zip
          unzip -q rojo.zip
          chmod +x rojo
          sudo mv rojo /usr/local/bin/rojo
          rojo --version

      - name: Build Place (.rbxl)
        run: |
          rojo build default.project.json --output AI_Obby_Adventure.rbxl

      - name: Publish to Roblox Open Cloud
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
        run: |
          curl --fail --show-error --location \
            --request POST "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @AI_Obby_Adventure.rbxl
